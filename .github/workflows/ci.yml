name: CI

on:
  push:
    # The migration branches (Option B / Option C) must be independently testable,
    # so CI runs for them too, not only for the baseline branch.
    branches: [main, "migration/**"]
  pull_request:
    branches: [main, "migration/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Runs both unit projects: the React 16 stack (Jest 26) and, on the
        # migration branches, the React 19 stack (Jest 30 + RTL 16) for mfe-app-1.
        run: npm run test:unit

      - name: Build all applications
        run: npm run build

      # Install the Playwright browsers that the integration + E2E suites need.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Integration tests (real Module Federation runtime)
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
